{% extends "base.html" %}

{% block title %}Đăng Nhập | Quản Lý Bất Động Sản{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
    <div class="panel" style="padding: 2rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="font-size: 1.6rem; font-weight: 800; color: #0f172a;">Đăng Nhập Hệ Thống</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-top: 0.4rem;">Dành riêng cho nhân sự nội bộ</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label class="form-label" for="username">Tên đăng nhập</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="Ví dụ: admin hoặc user01" required autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.75rem;">
                <label class="form-label" for="password">Mật khẩu</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem; font-size: 1rem;">
                Đăng Nhập
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #64748b;">
            Chưa có tài khoản? <a href="{{ url_for('auth.register') }}" style="color: var(--primary); font-weight: 600; text-decoration: none;">Đăng ký nhân sự mới</a>
        </div>

        <div style="margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px dashed var(--border); font-size: 0.8rem; color: #64748b; background: #f8fafc; padding: 0.75rem; border-radius: 0.5rem;">
            <strong>Tài khoản mặc định:</strong><br>
            Username: <code>admin</code> | Password: <code>admin123</code> (Vai trò: ADMIN tối cao)
        </div>
    </div>
</div>
{% endblock %}
